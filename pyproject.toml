[project]
name = "slowburn"
version = "0.1.0"
description = "Measuring whether LLM safety properties degrade as context accumulates."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-genai>=0.3.0",
    "pydantic>=2.0",
    "tiktoken>=0.7.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "pandas>=2.0",
    # UI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "streamlit>=1.40.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slowburn"]
